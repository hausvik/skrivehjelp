<!DOCTYPE html>
<html lang="en">
<title>Standardtekster</title>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        button {
            margin: 5px;
            font-size: 16px;
            display: none;
        }

        .folder-container {
            display: flex;
            flex-direction: column;
            padding: 5px;
            border: 1px solid #000000;
            box-sizing: border-box;
            margin-bottom: 5px;
            background-color: #cccc;
        }

        .subfolder-container {
            display: flex;
            flex-direction: column;
            padding: 5px;
            border: 1px solid #000000;
            box-sizing: border-box;
            margin-bottom: 5px;
            background-color: #acacaccc;
            display: none;
        }


        .folder-container h3 {
            font-size: 16px;
        }

        .folder-container h4 {
            font-size: 14px;
        }

        .centered-text {
            text-align: center;
        }

        .utkast-text-color {
            color: #FFA500;
            font-weight: bold;
        }

        .btn-red {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        .btn-red:hover {
            background-color: #e60000;
        }

        .btn-blue {
            background-color: #4d79ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-blue:hover {
            background-color: #0033cc;
        }

        .btn-draft {
            background-color: #E69500;
            color: rgb(0, 0, 0);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        .btn-draft:hover {
            background-color: #B37400;
        }

        .btn-production {
            background-color: #008080;
            color: rgb(255, 255, 255);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-production:hover {
            background-color: #005757;
        }
    </style>

</head>

<body>
    <div class="centered-text">
        <h3 class="mb-5">Standardtekster</h3>
    </div>
    <div class="centered-text">
        <label>
            <input type="checkbox" id="show-drafts-checkbox"> Vis utkast (<span class="utkast-text-color">oransje</span>)
        </label>
    </div>
    <div id="button-container"></div>
    <script src="../standardteksterpane/standardteksterpane.ts"></script>
    <div id="back-button-container"></div>
</body>

</html>
